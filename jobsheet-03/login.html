<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - SIMPUS-Mini</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Katalog Buku</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Login Petugas / Anggota</h2>
            <form action="#" method="POST">
                <p>
                    <label for="username">Username / NIM</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username atau NIM Anda" required>
                </p>
                
                <p>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </p>

                <p>
                    <button type="submit">Masuk</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini - Politeknik Negeri Malang</p>
    </footer>

</body>
</html>
